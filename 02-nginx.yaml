- name: "Installing and starting the nginx"
  hosts: "local"
  connection: "local"
  become: "yes"
  tasks:
  - name: "installing nginx"
    ansible.builtin.package:
      name: "nginx"
      state: "present"

  - name: "starting the nginx"
    ansible.builtin.service:
      name: "nginx"   
      state: "started"
      enabled: yes
